# BirdNET3_Geo_Fullstack_Web v0.2.1 · SOLO navegador / GitHub Pages
project:
  name: BirdNET3_Geo_Fullstack_Web
  version: 0.2.1
models:
  keep_local: true
  # Fuentes oficiales; no publicar modelos en el repositorio.
  acoustic_url: "https://zenodo.org/records/20703646/files/BirdNET+_V3.0-preview3.1_Global_11K_FP16_pruned.onnx?download=1"
  acoustic_labels_url: "https://zenodo.org/records/20703646/files/BirdNET+_V3.0-preview3.1_Global_11K_Labels.csv?download=1"
  geo_url: "https://birdnet-team.github.io/geomodel/demo/geomodel_fp16.onnx"
  geo_labels_url: "https://birdnet-team.github.io/geomodel/demo/labels.txt"
metadata:
  default_timezone: "-05:00"
audio:
  sample_rate: 32000
inference:
  device: auto
  window_seconds: 5.0
  overlap_seconds: 1.0
  top_k: 100
  min_confidence: 0.01
  visualization_threshold: 0.10
geo:
  enabled: true
spectrogram:
  max_frequency_hz: 12000
  zoom_fft_normal: 1024
  zoom_fft_medium: 2048
  zoom_fft_close: 4096
