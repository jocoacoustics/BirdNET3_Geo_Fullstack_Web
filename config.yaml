# BirdNET3_Geo_Fullstack_Web · v0.2.0
# Configuración leída directamente por el frontend. Valores simples: sin listas YAML.
project:
  name: BirdNET3_Geo_Fullstack_Web
  version: 0.2.0
models:
  keep_local: true
  acoustic_url: models/acoustic_fp16.onnx
  acoustic_labels_url: models/acoustic_labels.csv
  geo_url: models/geo_fp16.onnx
  geo_labels_url: models/geo_labels.txt
metadata:
  default_timezone: "-05:00"
audio:
  sample_rate: 32000
inference:
  device: auto            # auto | webgpu | wasm. WebGPU -> WASM si hay incompatibilidad.
  window_seconds: 5.0
  overlap_seconds: 1.0
  top_k: 100
  min_confidence: 0.01
  visualization_threshold: 0.10
geo:
  enabled: true
  # BirdNET Geo recibe latitud, longitud, semana dentro del año de 48 semanas.
spectrogram:
  max_frequency_hz: 12000
  zoom_fft_normal: 1024
  zoom_fft_medium: 2048
  zoom_fft_close: 4096
